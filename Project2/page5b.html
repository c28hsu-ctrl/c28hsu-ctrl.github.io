<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Path of Stealth</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <section class="container"> 
        <h1>The Path of Stealth</h1>
        <p>To successfully navigate the Path of Stealth, you must choose your actions carefully. Select the correct sequence of actions to avoid detection and reach your objective.</p>
        <!-- Actions -->
        <div class="stealth-option" data-action="hide">Hide in the shadows</div>
        <div class="stealth-option" data-action="run">Run quickly to the next cover</div>
        <div class="stealth-option" data-action="distract">Create a distraction</div>
        <div class="stealth-option" data-action="wait">Wait for the right moment</div>
        <!-- Buttons -->
        <button id="checkBtn">Check Sequence</button>
        <button id="resetBtn">Reset!</button>
        <script>
        const correctSequence = ['hide', 'wait', 'distract'];
        // Your Code here
        let userSequence = [];

        const options = document.querySelectorAll('.stealth-option');
        const checkBtn = document.getElementById('checkBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Highlight + record action
        options.forEach(option => {
            option.addEventListener('click', function () {
                const action = this.dataset.action;

                // Visual feedback
                this.style.backgroundColor = '#444';
                this.style.color = 'white';

                // Record the action
                userSequence.push(action);
            });
        });
         checkBtn.addEventListener('click', function () {
                let isCorrect = true;
                for (let i = 0; i < userSequence.length; i++) {
                    if (userSequence[i] !== correctSequence[i]) {
                        isCorrect = false;
                        break;
                        }
                    }

                if (isCorrect) {
                    alert("Correct! You have master stealth.");
                    window.location.href = "page6.html";
                } else {
                    alert("That sequence was incorrect. Try again.");
                    resetSequence();
                }
            });

        // Reset function
        function resetSequence() {
            userSequence = [];
            options.forEach(option => {
                option.style.backgroundColor = '';
                option.style.color = '';
            });
        }
        resetBtn.addEventListener('click', resetSequence);
        </script>
    </section>
</body>
</html>
