<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Quest Begins</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <section class="container">
        <form id="bagForm" type="get" action="page4.html">
            <h1>Pack Your Bag</h1>
            <p>Select the supplies you wish to take on your quest. Choose wisely, as you can only carry a limited amount.</p>

            <fieldset>
                <input type="checkbox" id="Food" name="supply" value="F" />
                <label for="Food"><strong>Food: </strong>Essential for energy.</label><br />

                <input type="checkbox" id="Water" name="supply" value="W" />
                <label for="Water"><strong>Water: </strong>Hydration is key!</label><br />

                <input type="checkbox" id="MagicPotions" name="supply" value="MP" />
                <label for="MagicPotions"><strong>Magic Potions: </strong>For health and magical energy.</label><br />

                <input type="checkbox" id="Maps" name="supply" value="M" />
                <label for="Maps"><strong>Maps: </strong>Don't get lost in the wilderness!</label><br />

                <input type="checkbox" id="Sword" name="supply" value="S" />
                <label for="Sword"><strong>Sword: </strong>Fend off those pesky foes!</label><br />

                <input type="submit" id="Continue" value="Continue" />
            </fieldset>
        </form>
    </section>
</body>
</html>
