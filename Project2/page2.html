<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Selection</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <section class="container">
        <form id="characterForm" type="get" action="page3.html">
            <fieldset>
                <legend><strong>Choose Your CHaracter</strong></legend>

                <input type="radio" id="aria" name="hero" value="A" />
                <label for="aria"><strong>Aria, the Warrior:</strong> Strong and brave, with the ability to overcome physical obstacles.</label><br />
                <input type="radio" id="eldrin" name="hero" value="E" />
                <label for="aria"><strong>Eldrinm the Mage:</strong> Wise and knowledgeable, with the power to solve puzzles and cast spells.</label><br />
                <input type="radio" id="tara" name="hero" value="T" />
                <label for="aria"><strong>Tara, the Rogue:</strong> Quick and cunning, with skills in stealth and persuation.</label><br />

                <input type="submit" id="Continue" value="Continue" />
            </fieldset>
        </form>
    </section>
</body>
</html>
