<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <main class="container">
    <form "incomeForm">
        <fieldset>
        <legend><b>Add Expenses</b></legend>
        <div class="mb-3">
        <label for="expenseName" class="form-label">Place of expense:</label>
        <input 
            type="text" 
            class="form-control"
            id="expenseName" 
            required 
            minlength="5"
            title="Please enter a minimum expence name of 5 characters">
        </div>

        <div class="mb-3"></div>
        <label for="expenseDate" class="form-label">Expense Date:</label>
        <input
            type="datemin"
            class="form-control"
            id="expenseDate"
            required
            min= new Date();>
        </div>

        <div class="mb-3">
        <label for="expenseAmount" class="form-label">Amount:</label>
        <input id="expenseAmount"
            class="form-control"
            min="0"
            max="50000">
        </div>
        
        <div class="mb-3">
            <label for="expenseCategory" class="form-label">Expense Category:</label><br>
            <label for="groceries" class="form-label">Grocery</label>
            <input type="checkbox">
            <label for="business" class="form-label">Business</label>
            <input type="checkbox">
            <label for="restaurants" class="form-label">Restaurants</label>
            <input type="checkbox">
            <label for="fun" class="form-label">Fun</label>
            <input type="checkbox">
        </div>

        <div class="mb-3">
            <label for="payment" class="form-label">Mode of Payment</label>
            <select id="payment" class="form-control">
                <option 
            </select>
        </div>

        <div>
        <button type="submit" class="btn btn-primary">Submit</button>
        </div>
        </fieldset>
    </form>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </main>
</body>
</html>
