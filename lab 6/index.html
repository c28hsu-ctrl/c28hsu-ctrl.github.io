<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form id="sienaForm">
        <label for="emailAddress">Siena College Email:</label>
        <input 
            type="email" 
            id="emailAddress" 
            placeholder="Enter your Siena email" 
            required 
            pattern=".+@siena\.edu" 
            title="Please enter a valid Siena College email ending with @siena.edu">

        <label for="sienaID">Siena ID:</label>
        <input
            type="text"
            id="sienaID"
            placeholder="Enter your Siena ID"
            required
            pattern="98.{6}"
            title="Please enter a valid Siena College ID starting with 98 and 8 digits in length">
            <button type="submit">Submit</button>
    </form>
    <script src="script.js" defer></script>
</body>
</html>
