<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <main class="container">
    <form "incomeForm">
        <legend><b>Add Income</b></legend>
        <div class="mb-3">
        <label for="incomeSource" class="form-label">Income Source Name:</label>
        <input 
            type="text" 
            class="form-control"
            id="incomeSource" 
            required 
            minlength="3"
            title="Please enter a minimum source name of 3 characters">
        </div>

        <div class="mb-3"></div>
        <label for="amount" class="form-label">Amount:</label>
        <input
            type="text"
            class="form-control"
            id="amount"
            required
            >
    </div>

        <div class="mb-3">
        <label for="frequency" class="form-label">Frequency:</label>
        <select id="frequency" class="form-control">
            <option value="one-time">One-time</option>
            <option value="monthly">Monthly</option>
            <option value="bi-weeky">Bi-weeky</option>
            <option value="yearly">Yearly</option>
        </select>
        </div>
        <div>
        <button type="submit" class="btn btn-primary">Submit</button>
        </div>

    </form>
    <script>
        let decimal = document.getElementById("amount");
        let convert = Number(decimal.value);
        decimal.addEventListener("mouseleave", (e) => {
            convert = convert.toFixed(2);
            decimal = convert;

        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </main>
</body>
</html>
